<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: #161f32;
      --bg-card-hover: #1e2942;
      --border: #26324d;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --ucl-gold: #eab308;
      --ucl-bg: rgba(234, 179, 8, 0.14);
      --win: #10b981;
      --draw: #f59e0b;
      --loss: #ef4444;
      --corner-badge: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 3rem;
    }

    /* Header */
    header {
      background: linear-gradient(180deg, #131c31 0%, var(--bg-primary) 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 1rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .live-pill {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.15);
      color: var(--win);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    input[type="text"] {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.88rem;
      min-width: 210px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-toggle {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-toggle.active-ucl {
      background: var(--ucl-bg);
      color: var(--ucl-gold);
      border-color: rgba(234, 179, 8, 0.5);
    }

    /* League Tabs */
    .league-tabs {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.35rem;
      scrollbar-width: thin;
    }

    .league-tabs::-webkit-scrollbar {
      height: 4px;
    }

    .league-tabs::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .tab-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.42rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: #3b4d75;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Summary Strip */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
      margin: 1.25rem 1rem 0;
    }

    .stat-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 0.15rem;
    }

    /* League Section */
    main {
      padding: 0 1rem;
    }

    .league-section {
      margin-top: 2rem;
    }

    .league-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .league-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .league-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Team Grid */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 0.85rem;
    }

    .team-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .team-card:hover {
      transform: translateY(-2px);
      border-color: #3d5280;
      background: var(--bg-card-hover);
    }

    .team-card.ucl-team {
      border-left: 3px solid var(--ucl-gold);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .team-name {
      font-weight: 700;
      font-size: 0.98rem;
      color: #fff;
    }

    .ucl-tag {
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--ucl-bg);
      color: var(--ucl-gold);
      border: 1px solid rgba(234, 179, 8, 0.4);
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      white-space: nowrap;
    }

    .match-box {
      background: rgba(11, 15, 25, 0.65);
      border: 1px solid rgba(38, 50, 77, 0.7);
      border-radius: 8px;
      padding: 0.6rem 0.75rem;
      font-size: 0.83rem;
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .outcome-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.12rem 0.45rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .outcome-W { background: rgba(16, 185, 129, 0.18); color: var(--win); }
    .outcome-D { background: rgba(245, 158, 11, 0.18); color: var(--draw); }
    .outcome-L { background: rgba(239, 68, 68, 0.18); color: var(--loss); }

    .corner-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.55rem;
      border-top: 1px dashed var(--border);
      font-size: 0.8rem;
    }

    .corner-label {
      color: var(--text-muted);
    }

    .corner-stats {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 600;
    }

    .corner-pill {
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.78rem;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding: 0 1rem;
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.12rem; }
      input[type="text"] { width: 100%; }
      .team-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

  const containerEl = document.getElementById("leaguesContainer");

  const searchEl = document.getElementById("searchInput");
  const uclToggleEl = document.getElementById("uclToggle");

  function renderTabs() {
    const allTab = `<button class="tab-btn ${activeLeague === 'all' ? 'active' : ''}" onclick="setLeague('all')">All 10 Leagues</button>`;
    const leagueBtns = LEAGUES_DATA.map(l => `
      <button class="tab-btn ${activeLeague === l.id ? 'active' : ''}" onclick="setLeague('${l.id}')">
        ${l.flag} ${l.name}
      </button>
    `).join("");
    tabsEl.innerHTML = allTab + leagueBtns;
  }

  window.setLeague = function(id) {
    activeLeague = id;
    renderTabs();
    renderDashboard();
  };

  uclToggleEl.addEventListener("click", () => {
    onlyUcl = !onlyUcl;
    uclToggleEl.classList.toggle("active-ucl", onlyUcl);
    renderDashboard();
  });

  searchEl.addEventListener("input", (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderDashboard();
  });

  function renderDashboard() {
    let totalTeams = 0;
    let totalUcl = 0;
    let topCornerTeam = { name: "-", cornersAvg: 0 };

    const filteredLeagues = LEAGUES_DATA
      .filter(l => activeLeague === "all" || l.id === activeLeague)
      .map(league => {
        const matchedTeams = league.teams.filter(t => {
          const matchesUcl = !onlyUcl || t.ucl;
          const matchesSearch =
            !searchQuery ||
            t.name.toLowerCase().includes(searchQuery) ||
            league.name.toLowerCase().includes(searchQuery);
          return matchesUcl && matchesSearch;
        });
        return { ...league, teams: matchedTeams };
      })
      .filter(l => l.teams.length > 0);

    filteredLeagues.forEach(l => {
      l.teams.forEach(t => {
        totalTeams++;
        if (t.ucl) totalUcl++;
        if (t.cornersAvg > topCornerTeam.cornersAvg) {
          topCornerTeam = t;
        }
      });
    });

    summaryEl.innerHTML = `
      <div class="stat-box">
        <div class="stat-label">Leagues Shown</div>
        <div class="stat-value">${filteredLeagues.length}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Teams Featured</div>
        <div class="stat-value">${totalTeams}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">26/27 UCL Clubs</div>
        <div class="stat-value" style="color: var(--ucl-gold);">${totalUcl}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Top Corner Avg</div>
        <div class="stat-value" style="color: #c4b5fd;">${topCornerTeam.name} (${topCornerTeam.cornersAvg}/m)</div>
      </div>
    `;

    if (filteredLeagues.length === 0) {
      containerEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:3rem;">No teams match your current filters.</p>`;
      return;
    }

    containerEl.innerHTML = filteredLeagues.map(league => `
      <section class="league-section">
        <div class="league-header">
          <div class="league-title">${league.flag} ${league.name} <span style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">(${league.teams.length} teams)</span></div>
          <div class="league-meta">${league.matchday}</div>
        </div>
        <div class="team-grid">
          ${league.teams.map(team => `
            <div class="team-card ${team.ucl ? 'ucl-team' : ''}">
              <div class="card-top">
                <div class="team-name">${team.name}</div>
                ${team.ucl ? `<span class="ucl-tag">★ UCL 26/27</span>` : ``}
              </div>
              <div class="match-box">
                <div class="match-row">
                  <span>Last: <strong>${team.lastMatch}</strong></span>
                  <span class="outcome-pill outcome-${team.res}">${team.res}</span>
                </div>
              </div>
              <div class="corner-box">
                <span class="corner-label">26/27 Corners Taken</span>
                <div class="corner-stats">
                  <span>${team.cornersTotal} total</span>
                  <span class="corner-pill">${team.cornersAvg} / match</span>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      </section>
    `).join("");
  }

  renderTabs();
  renderDashboard();
